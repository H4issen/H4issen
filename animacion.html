<!DOCTYPE html>
<html lang="es">
<head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      /* Color de fondo oscuro de GitHub, para que el GIF no tenga bordes blancos feos */
      background-color: #0d1117; 
    }
    .moneda {
      width: 200px;
      /* Animación que dura 5 segundos y se repite infinito */
      animation: flotarYGirar 5s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    
    /* La magia de la secuencia que pediste */
    @keyframes flotarYGirar {
      0%   { transform: translateY(0px) rotateY(0deg); }
      15%  { transform: translateY(-20px) rotateY(0deg); } /* Sube */
      30%  { transform: translateY(0px) rotateY(0deg); }   /* Baja */
      45%  { transform: translateY(-15px) rotateY(0deg); } /* Sube un poco */
      60%  { transform: translateY(0px) rotateY(0deg); }   /* Baja */
      80%  { transform: translateY(0px) rotateY(360deg); } /* GIRA COMO MONEDA */
      100% { transform: translateY(0px) rotateY(360deg); } /* Pausa antes de repetir */
    }
  </style>
</head>
<body>
  <!-- Cambia el nombre si tu logo se llama distinto -->
  <img src="logo.png" class="moneda">
</body>
</html>
