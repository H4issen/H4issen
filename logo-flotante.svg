<svg width="250" height="250" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .flotante {
      /* Aquí controlamos la velocidad, 3s es suave y constante */
      animation: flotar 3s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes flotar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); } /* Sube 20 pixeles */
      100% { transform: translateY(0px); } /* Vuelve a bajar */
    }
  </style>
  
  <!-- Aplica la animación a la imagen -->
  <g class="flotante">
    <!-- REEMPLAZA EL ENLACE DE "href" CON LA URL O RUTA DE TU LOGO -->
    <image href="jp logo(1).png" x="25" y="25" width="200" height="200" />
  </g>
</svg>
